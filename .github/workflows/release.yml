name: release

on:
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.changes.outputs.enabled }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version change together with changelog changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          "enabled=false" >> $env:GITHUB_OUTPUT
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:BEFORE_COMMIT -match '^0+$') {
              'Initial repository push: use the manual release entry after setup.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            $changed = @(git diff --name-only $env:BEFORE_COMMIT HEAD -- Directory.Build.props CHANGELOG.md)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot compare the release changes.' }
            if ('Directory.Build.props' -notin $changed -or 'CHANGELOG.md' -notin $changed) {
              'Skipped: update the version and changelog together to release.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            $previousXml = git show "${env:BEFORE_COMMIT}:Directory.Build.props"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read the previous version.' }
            [xml]$previous = $previousXml -join "`n"
            $prefixNode = $previous.SelectSingleNode('/Project/PropertyGroup/VersionPrefix')
            $suffixNode = $previous.SelectSingleNode('/Project/PropertyGroup/VersionSuffix')
            if ($null -eq $prefixNode) {
              # The initial policy setup moves the existing version out of the app project.
              $previousAppXml = git show "${env:BEFORE_COMMIT}:src/DiscImageStudio.App/DiscImageStudio.App.csproj"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read the legacy app version.' }
              [xml]$previousApp = $previousAppXml -join "`n"
              $previousVersion = $previousApp.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
            } else {
              $previousVersion = $prefixNode.InnerText
              if ($null -ne $suffixNode -and $suffixNode.InnerText) { $previousVersion += '-' + $suffixNode.InnerText }
            }
            $current = ./packaging/Get-ReleaseMetadata.ps1
            if ($current.Version -ceq $previousVersion) {
              'Skipped: the configured version has not changed.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
          }
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Validate version, main ancestry and release notes
        if: steps.changes.outputs.enabled == 'true'
        id: release
        run: |
          $metadata = ./packaging/Get-ReleaseMetadata.ps1 -RequireReleaseNotes
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the release commit.' }
          git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to origin/main.' }
          "tag=$($metadata.Tag)" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "prerelease=$($metadata.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  validate:
    needs: metadata
    if: needs.metadata.outputs.enabled == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      release_tag: ${{ needs.metadata.outputs.tag }}

  package:
    needs: [metadata, validate]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
    env:
      DOTNET_NUGET_SIGNATURE_VERIFICATION: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install the verified .NET SDK
        run: python packaging/Install-DotNetSdk.py

      - name: Build and verify standalone EXE
        run: ./packaging/Build-Release.ps1 -Tag $env:RELEASE_TAG

      - name: Generate the Windows artifact SBOM
        env:
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          $directory = Join-Path 'artifacts/release' $env:RELEASE_TAG
          $artifact = Join-Path $directory "DiscImageStudio-$env:RELEASE_TAG-win-x64.exe"
          python packaging/Write-ReleaseSbom.py --artifact $artifact `
            --deps-json src/DiscImageStudio.App/bin/Release/net10.0-windows/win-x64/DiscImageStudio.deps.json `
            --assets-json src/DiscImageStudio.App/obj/project.assets.json `
            --rid win-x64 --source-commit $env:RELEASE_COMMIT --repository $env:GITHUB_REPOSITORY `
            --output "$artifact.cdx.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows SBOM generation failed.' }

      - name: Collect tested CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-${{ needs.metadata.outputs.tag }}-*
          path: artifacts/release/${{ needs.metadata.outputs.tag }}
          merge-multiple: true

      - name: Prepare release notes
        run: |
          $metadata = ./packaging/Get-ReleaseMetadata.ps1 -Tag $env:RELEASE_TAG -RequireReleaseNotes
          $directory = Join-Path 'artifacts/release' $metadata.Tag
          $manifest = Join-Path $directory 'SHA256SUMS.txt'
          $hashes = @((Get-Content -LiteralPath $manifest -Raw).Trim())
          foreach ($rid in 'linux-x64','linux-arm64','osx-x64','osx-arm64') {
            $archive = "DiscImageStudio-CLI-$($metadata.Tag)-$rid.tar.gz"
            $path = Join-Path $directory $archive
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$hash  $archive"
            if ((Get-Content -LiteralPath "$path.sha256" -Raw).Trim() -cne $line) {
              throw "Downloaded CLI checksum does not match for $archive."
            }
            $hashes += $line
          }
          $sboms = @(Get-ChildItem -LiteralPath $directory -Filter '*.cdx.json' -File)
          if ($sboms.Count -ne 5) { throw 'Exactly five artifact SBOMs are required.' }
          foreach ($sbom in $sboms) {
            $hashes += "$((Get-FileHash -LiteralPath $sbom.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($sbom.Name)"
          }
          $checksum = $hashes -join "`n"
          [IO.File]::WriteAllText($manifest, "$checksum`n", [Text.UTF8Encoding]::new($false))
          $notes = @(
            $metadata.Notes
            ''
            '### 下载与运行 / Download and run'
            ''
            '下载下方 win-x64.exe 后直接运行，支持 Windows 10 2004+ / Windows 11 x64，已内置 .NET 运行时。'
            '此便携 EXE 未进行代码签名。即时流式刻录仍为实验性功能；硬件实测范围以仓库验证记录为准。'
            '**Linux 和 macOS 命令行版为实验性功能。** 按系统和处理器选择自包含的 tar.gz，解压后运行 `./disc-image-studio --help`。macOS 的 arm64 对应 Apple 芯片，x64 对应 Intel。'
            ''
            'Download the win-x64.exe below and run it directly on Windows 10 2004+ / Windows 11 x64. The .NET runtime is included.'
            'This portable EXE is unsigned. Live streaming burn remains experimental; see the repository validation records for tested hardware coverage.'
            '**The Linux and macOS CLIs are experimental.** Extract the self-contained tar.gz matching your OS and CPU, then run `./disc-image-studio --help` in that directory. On macOS, arm64 is Apple silicon and x64 is Intel.'
            ''
            '### SHA-256'
            ''
            '使用 Windows 的 Get-FileHash、Linux 的 sha256sum 或 macOS 的 shasum -a 256 检查下载文件，并与对应文件名的校验值比较。'
            'Use Get-FileHash on Windows, sha256sum on Linux or shasum -a 256 on macOS and compare the result with the entry for your filename.'
            ''
            '```powershell'
            "Get-FileHash .\DiscImageStudio-$($metadata.Tag)-win-x64.exe -Algorithm SHA256"
            '```'
            ''
            '```text'
            $checksum
            '```'
            ''
            '### 构建来源验证 / Verify build provenance'
            ''
            '使用 GitHub CLI 检查下载文件的构建来源、仓库、工作流与源代码提交。'
            'Use GitHub CLI to verify the downloaded artifact against this repository, release workflow and source commit.'
            ''
            '```text'
            "gh attestation verify DiscImageStudio-$($metadata.Tag)-win-x64.exe --repo $env:GITHUB_REPOSITORY --signer-workflow $env:GITHUB_REPOSITORY/.github/workflows/release.yml --source-digest $env:RELEASE_COMMIT"
            '```'
            ''
            '每个可执行文件和压缩包均附带 CycloneDX SBOM；SHA256SUMS.txt 包含文件及其 SBOM 的校验值。'
            'Each executable/archive includes a CycloneDX SBOM; SHA256SUMS.txt covers the artifacts and their SBOMs.'
            ''
            '### 源代码与构建 / Source and build'
            ''
            '从本页的 Source code (zip / tar.gz) 下载完整对应源代码；构建说明见下方 README 链接。'
            'Download the complete corresponding source from Source code (zip / tar.gz) on this page. Build instructions are in the README linked below.'
            ''
            "构建说明 / Build instructions: [简体中文 README]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_COMMIT/README.md) | [English README]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_COMMIT/README.en.md)"
            ''
            "源码提交 / Source commit: $env:RELEASE_COMMIT"
          ) -join "`n"
          Set-Content -LiteralPath (Join-Path $directory 'release-notes.md') -Value $notes -Encoding utf8
        env:
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}

      - id: release_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.metadata.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release/${{ needs.metadata.outputs.tag }}/*.exe
            artifacts/release/${{ needs.metadata.outputs.tag }}/*.tar.gz
            artifacts/release/${{ needs.metadata.outputs.tag }}/*.cdx.json
            artifacts/release/${{ needs.metadata.outputs.tag }}/SHA256SUMS.txt
            artifacts/release/${{ needs.metadata.outputs.tag }}/release-notes.md

  inspect:
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      manifest: ${{ steps.inspect.outputs.manifest }}
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: release
      - name: Inspect exact attachment names, hashes, and SBOM identities
        id: inspect
        shell: bash
        run: |
          python packaging/ReleaseArtifacts.py inspect --directory release --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" --output "$RUNNER_TEMP/release-manifest.json"
          printf 'manifest=%s\n' "$(cat "$RUNNER_TEMP/release-manifest.json")" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance for binaries and their SBOMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-checksums: release/SHA256SUMS.txt
      - name: Attest SBOM for win-x64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-path: release/DiscImageStudio-${{ needs.metadata.outputs.tag }}-win-x64.exe
          sbom-path: release/DiscImageStudio-${{ needs.metadata.outputs.tag }}-win-x64.exe.cdx.json
      - name: Attest SBOM for linux-x64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-linux-x64.tar.gz
          sbom-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-linux-x64.tar.gz.cdx.json
      - name: Attest SBOM for linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-linux-arm64.tar.gz
          sbom-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-linux-arm64.tar.gz.cdx.json
      - name: Attest SBOM for osx-x64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-osx-x64.tar.gz
          sbom-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-osx-x64.tar.gz.cdx.json
      - name: Attest SBOM for osx-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-osx-arm64.tar.gz
          sbom-path: release/DiscImageStudio-CLI-${{ needs.metadata.outputs.tag }}-osx-arm64.tar.gz.cdx.json

  draft:
    needs: [metadata, package, inspect]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # No third-party action runs with the publication token. The only code
      # downloaded here is our publisher at the exact validated main commit.
      - name: Publish inspected entries without extracting the artifact archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          RELEASE_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          RELEASE_MANIFEST: ${{ needs.inspect.outputs.manifest }}
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/$GH_REPO/$RELEASE_COMMIT/packaging/ReleaseArtifacts.py" \
            --output "$RUNNER_TEMP/release-publisher.py"
          python3 "$RUNNER_TEMP/release-publisher.py" publish
