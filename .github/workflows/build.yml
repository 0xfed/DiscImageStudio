name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string
      release_tag:
        description: Upload the tested CLI archives for this release
        required: false
        type: string

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: macos-15-intel, rid: osx-x64 }
          - { runner: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NUGET_SIGNATURE_VERIFICATION: 'true'
      DOTNET_NOLOGO: '1'
      RID: ${{ matrix.rid }}
      PACKAGE_TAG: ${{ inputs.release_tag || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Validate portable image decoder resource limits
        run: dotnet run --project tests/DiscImageStudio.ImageIOTests --configuration Release

      - name: Validate release SBOM and workflow security
        run: python -m unittest discover -s tests -p 'test_release_*.py'

      - name: Validate localization catalogs and source coverage
        run: dotnet run --project tests/DiscImageStudio.LocalizationTests --configuration Release

      - name: Validate translated burning workflows with fake recorders
        run: dotnet run --project tests/DiscImageStudio.Burning.LocalizationTests --configuration Release

      - name: Validate documentation translation rules
        run: python3 -m unittest discover -s tests -p test_documentation_translation_rules.py

      - name: Validate complete documentation translations
        run: python3 tests/test_documentation_translations.py --require-complete

      - name: Validate Python translation resources and parser behavior
        run: python3 -m unittest discover -s tests -p test_python_localization.py

      - name: Validate translated Python tools and synthetic figure layouts
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/python-localization"
          "$RUNNER_TEMP/python-localization/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements-ci.lock
          "$RUNNER_TEMP/python-localization/bin/python" tests/test_python_tool_localization.py

      - name: Validate translated Blu-ray probe against independent reference vectors
        run: |
          dotnet build tools/BluRayByteProbe --configuration Release
          python3 tests/test_probe_localization.py tools/BluRayByteProbe/bin/Release/net10.0/BluRayByteProbe.dll

      - name: Publish and archive the self-contained CLI
        shell: bash
        run: |
          archive="DiscImageStudio-CLI-$PACKAGE_TAG-$RID.tar.gz"
          dotnet restore src/DiscImageStudio.Cli/DiscImageStudio.Cli.csproj \
            -r "$RID" --locked-mode -p:SelfContained=true
          dotnet publish src/DiscImageStudio.Cli/DiscImageStudio.Cli.csproj --no-restore \
            -c Release -r "$RID" --self-contained true -o "$RUNNER_TEMP/publish"
          mkdir -p artifacts/cli
          tar -czf "artifacts/cli/$archive" -C "$RUNNER_TEMP/publish" disc-image-studio \
            -C "$GITHUB_WORKSPACE" LICENSE THIRD-PARTY-NOTICES.txt
          python3 packaging/Write-ReleaseSbom.py \
            --artifact "artifacts/cli/$archive" \
            --deps-json "src/DiscImageStudio.Cli/bin/Release/net10.0/$RID/disc-image-studio.deps.json" \
            --assets-json src/DiscImageStudio.Cli/obj/project.assets.json \
            --rid "$RID" --source-commit "$(git rev-parse HEAD)" --repository "$GITHUB_REPOSITORY" \
            --output "artifacts/cli/$archive.cdx.json"
          (cd artifacts/cli && shasum -a 256 "$archive" > "$archive.sha256")

      - name: Test the extracted CLI on the target platform
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/cli-smoke"
          tar -xzf "artifacts/cli/DiscImageStudio-CLI-$PACKAGE_TAG-$RID.tar.gz" -C "$RUNNER_TEMP/cli-smoke"
          python3 tests/test_cli_package.py "$RUNNER_TEMP/cli-smoke/disc-image-studio"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release_tag != ''
        with:
          name: cli-${{ inputs.release_tag }}-${{ matrix.rid }}
          path: artifacts/cli/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NUGET_SIGNATURE_VERIFICATION: 'true'
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Restore
        run: dotnet restore DiscImageStudio.slnx --locked-mode

      - name: Validate release SBOM and workflow security
        run: python -m unittest discover -s tests -p 'test_release_*.py'

      - name: Validate release tooling
        run: ./tests/Test-ReleaseTooling.ps1

      - name: Validate translated packaging preflight
        run: ./tests/Test-PackagingLocalization.ps1

      - name: Validate translated packaging preflight on Windows PowerShell
        shell: powershell
        run: ./tests/Test-PackagingLocalization.ps1

      - name: Build
        run: dotnet build DiscImageStudio.slnx --configuration Release --no-restore

      - name: Validate portable image decoder resource limits
        run: dotnet run --project tests/DiscImageStudio.ImageIOTests --configuration Release --no-build

      - name: Validate localization catalogs and source coverage
        run: dotnet run --project tests/DiscImageStudio.LocalizationTests --configuration Release --no-build

      - name: Validate translated burning workflows with fake recorders
        run: dotnet run --project tests/DiscImageStudio.Burning.LocalizationTests --configuration Release --no-build

      - name: Validate documentation translation rules
        run: python -m unittest discover -s tests -p test_documentation_translation_rules.py

      - name: Validate complete documentation translations
        run: python tests/test_documentation_translations.py --require-complete

      - name: Validate Python translation resources and parser behavior
        run: python -m unittest discover -s tests -p test_python_localization.py

      - name: Validate translated Python tools and synthetic figure layouts
        run: |
          python -m venv "$env:RUNNER_TEMP/python-localization"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonLocalization = "$env:RUNNER_TEMP/python-localization/Scripts/python.exe"
          & $pythonLocalization -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements-ci.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pythonLocalization tests/test_python_tool_localization.py

      - name: Validate translated Blu-ray probe against independent reference vectors
        run: python tests/test_probe_localization.py tools/BluRayByteProbe/bin/Release/net10.0/BluRayByteProbe.dll

      - name: Validate translated dithering CLI and render five-language windows
        run: python tests/test_dither_tool_localization.py tools/FourLevelDither/bin/Release/net10.0-windows/FourLevelDither.dll

      - name: Validate translated DVD probe and experiment byte consistency
        run: python tests/test_dvd_probe_localization.py tools/DvdGrayProbe/bin/Release/net10.0-windows/DvdGrayProbe.dll

      - name: Validate translated desktop text bounds and capture workspace layouts
        timeout-minutes: 10
        env:
          DISC_IMAGE_STUDIO_UI_SNAPSHOTS: artifacts/ci/localization-layout
        run: dotnet run --project tests/DiscImageStudio.ArchitectureTests --configuration Release --no-build -- --localization-layout

      - name: Test module architecture
        run: dotnet run --project tests/DiscImageStudio.ArchitectureTests --configuration Release --no-build

      - name: Test original DVD engine
        run: dotnet run --project src/DvdImageSolver --configuration Release --no-build -- selftest

      - name: Test DVD through module catalog
        run: dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- selftest

      - name: Smoke-test CD module
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts\ci -Force | Out-Null
          dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- cd-generate --input src/DiscImageStudio.App/Assets/DiscImageStudio-256.png --output artifacts/ci/cd-smoke.raw --r0 24.5 --r1 24.6 --sectors 2 --velocity 1100 --theta0 0 --outer 57.5 --interleave true
          if ($LASTEXITCODE -ne 0) { throw "CD smoke generation failed." }
          if ((Get-Item artifacts\ci\cd-smoke.raw).Length -ne 4704) {
            throw "CD smoke output was not exactly two 2352-byte sectors."
          }

      - name: Render GUI screenshot
        run: dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- ui-snapshot --output artifacts/store/home-screen.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-artifacts
          path: |
            artifacts/ci/cd-smoke.raw
            artifacts/store/home-screen.png
            artifacts/ci/dither-languages/*.png
            artifacts/ci/python-localization-fixtures/*/*.png
            artifacts/ci/python-localization-fixtures/FIXTURES.txt
            artifacts/ci/localization-layout/
