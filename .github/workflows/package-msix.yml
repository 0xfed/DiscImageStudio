name: package-msix

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Partner Center Package/Identity/Name
        required: true
        type: string
      publisher:
        description: Partner Center Package/Identity/Publisher
        required: true
        type: string
      publisher_display_name:
        description: Partner Center PublisherDisplayName
        required: true
        type: string
      display_name:
        description: Reserved Store product name
        required: true
        type: string
      version:
        description: Optional A.B.C.0 override; leave empty to use Directory.Build.props
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/build.yml

  package:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NUGET_SIGNATURE_VERIFICATION: 'true'
      IDENTITY_NAME: ${{ inputs.identity_name }}
      PUBLISHER: ${{ inputs.publisher }}
      PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      PACKAGE_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install the verified .NET SDK
        run: python packaging/Install-DotNetSdk.py

      - name: Build Store MSIX
        shell: powershell
        run: |
          $versionOverride = @{}
          if ($env:PACKAGE_VERSION) { $versionOverride.Version = $env:PACKAGE_VERSION }
          .\packaging\Build-MSIX.ps1 `
            -IdentityName $env:IDENTITY_NAME `
            -Publisher $env:PUBLISHER `
            -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME `
            -DisplayName $env:DISPLAY_NAME @versionOverride

      - name: Generate and bind the MSIX SBOM
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/msix/*.msix -File)
          if ($packages.Count -ne 1) { throw 'Exactly one MSIX package is required.' }
          python packaging/Write-ReleaseSbom.py --artifact $packages[0].FullName `
            --deps-json src/DiscImageStudio.App/bin/Release/net10.0-windows/win-x64/DiscImageStudio.deps.json `
            --assets-json src/DiscImageStudio.App/obj/project.assets.json `
            --rid win-x64 --source-commit $env:GITHUB_SHA --repository $env:GITHUB_REPOSITORY `
            --output artifacts/msix/release.cdx.json
          if ($LASTEXITCODE -ne 0) { throw 'MSIX SBOM generation failed.' }

      - name: Attest the Store submission and SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-path: |
            artifacts/msix/*.msix
            artifacts/msix/release.cdx.json

      - name: Attest the Store submission SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          subject-path: artifacts/msix/*.msix
          sbom-path: artifacts/msix/release.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DiscImageStudio-x64-msix
          path: |
            artifacts/msix/*.msix
            artifacts/msix/release.cdx.json
          if-no-files-found: error
